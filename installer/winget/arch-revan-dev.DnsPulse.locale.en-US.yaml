ShortDescription: Encrypted DNS router, 6-layer availability doctor, 4-zone split-namespace engine, and driverless TLS-split PAC sidecar for Windows 10/11.
Description: >-
  DNS Pulse v2.0 (PulseCore) is an open-source Windows 10/11 encrypted DNS router and diagnostic suite.
  It supports DoH, DoH3, DoT, DoQ, DNSCrypt v2, ODoH, and SNI-Proxy nodes with 4-zone split-namespace routing,
  6-layer end-to-end availability diagnostics, a driverless TLS ClientHello SNI-split PAC sidecar,
  crash-safe atomic network rollback, and zero telemetry.
