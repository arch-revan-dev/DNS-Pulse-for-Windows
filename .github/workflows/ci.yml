name: CI (Web & Windows .NET 8)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-and-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run core unit tests
        run: npx tsx --test src/core/dnsEngine.test.ts

      - name: TypeScript typecheck
        run: npm run lint

      - name: Production Vite build
        run: npm run build

  windows-wpf-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & run xUnit tests
        run: dotnet test windows-wpf/DnsPulse.sln --configuration Release --verbosity normal
