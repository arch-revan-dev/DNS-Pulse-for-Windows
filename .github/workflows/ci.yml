name: CI (Web & Windows .NET 8)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-and-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run core unit tests
        if: hashFiles('package.json') != ''
        run: npx tsx --test src/core/dnsEngine.test.ts

      - name: TypeScript typecheck
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Production Vite build
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Skip notice for standalone Windows WPF repository
        if: hashFiles('package.json') == ''
        run: echo "Standalone Windows WPF repository detected (no package.json); skipping Web Studio checks."

  windows-wpf-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & run xUnit tests
        run: dotnet test windows-wpf/DnsPulse.sln --configuration Release --verbosity normal
