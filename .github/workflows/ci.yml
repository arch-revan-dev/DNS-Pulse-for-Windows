name: CI (PulseCore .NET 9 & Web Studio)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: 'skip'

jobs:
  pulsecore-dotnet:
    name: PulseCore .NET 9 (Build, Format, Test & ARM64 Check)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-ci-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-ci-${{ runner.os }}-
            nuget-

      - name: Restore NuGet dependencies
        run: dotnet restore DnsPulse.sln

      - name: Verify formatting (dotnet format)
        run: dotnet format DnsPulse.sln --verify-no-changes --no-restore

      - name: Build solution (Release, warnings as errors)
        run: dotnet build DnsPulse.sln --configuration Release --no-restore

      - name: Run xUnit test suite with code coverage
        run: >
          dotnet test DnsPulse.sln
          --configuration Release
          --no-build
          --verbosity minimal
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Report failed xUnit tests in summary and annotations
        if: failure()
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path TestResults -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## Failed xUnit Tests")
          $failedCount = 0
          foreach ($file in $trxFiles) {
            [xml]$doc = Get-Content -Path $file.FullName -Raw
            $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            $failed = $doc.SelectNodes("//t:UnitTestResult[@outcome='Failed']", $ns)
            foreach ($node in $failed) {
              $failedCount++
              $testName = $node.GetAttribute("testName")
              $msgNode = $node.SelectSingleNode("t:Output/t:ErrorInfo/t:Message", $ns)
              $stackNode = $node.SelectSingleNode("t:Output/t:ErrorInfo/t:StackTrace", $ns)
              $msg = if ($msgNode) { $msgNode.InnerText.Trim() } else { "Test failed without message." }
              $stack = if ($stackNode) { $stackNode.InnerText.Trim() } else { "" }
              $oneLine = ($msg -replace "[\r\n]+", " | ")
              if ($oneLine.Length -gt 400) { $oneLine = $oneLine.Substring(0, 400) + "..." }
              Write-Output "::error title=$testName::$oneLine"
              $lines.Add("")
              $lines.Add("### $testName")
              $lines.Add('```text')
              $lines.Add($msg)
              if ($stack) { $lines.Add($stack) }
              $lines.Add('```')
            }
          }
          if ($failedCount -eq 0) {
            $lines.Add("No failed TRX test entries found (check runner crash or test host stderr).")
            Write-Output "::error title=xUnit Test Suite::Test runner exited non-zero without failed TRX entries."
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pulsecore-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify win-arm64 compilation (App & Service)
        run: |
          dotnet build src/DnsPulse.App/DnsPulse.App.csproj --configuration Release -r win-arm64 --self-contained false -p:DebugType=none
          dotnet build src/DnsPulse.Service/DnsPulse.Service.csproj --configuration Release -r win-arm64 --self-contained false -p:DebugType=none

  web-studio:
    name: Companion Web Studio (tools/web-studio)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        if: hashFiles('tools/web-studio/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm cache
        if: hashFiles('tools/web-studio/package.json') != ''
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-web-studio-${{ runner.os }}-${{ hashFiles('tools/web-studio/package.json') }}
          restore-keys: |
            npm-web-studio-${{ runner.os }}-

      - name: Install dependencies
        if: hashFiles('tools/web-studio/package.json') != ''
        working-directory: tools/web-studio
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Run Web Studio unit tests
        if: hashFiles('tools/web-studio/package.json') != ''
        working-directory: tools/web-studio
        run: npm test

      - name: TypeScript typecheck
        if: hashFiles('tools/web-studio/package.json') != ''
        working-directory: tools/web-studio
        run: npm run lint

      - name: Production Vite build
        if: hashFiles('tools/web-studio/package.json') != ''
        working-directory: tools/web-studio
        run: npm run build
