name: Build & Release DNS Pulse (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run core unit tests, lint, and build
        if: hashFiles('package.json') != ''
        run: |
          npx tsx --test src/core/dnsEngine.test.ts
          npm run lint
          npm run build

      - name: Skip notice for standalone Windows WPF repository
        if: hashFiles('package.json') == ''
        run: echo "Standalone Windows WPF repository detected (no package.json); proceeding directly to Windows build."

  build-and-release-windows:
    needs: verify-core-tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows-wpf/DnsPulse.sln

      - name: Run xUnit test suite
        run: dotnet test windows-wpf/DnsPulse.sln --configuration Release --no-restore --verbosity normal

      - name: Publish self-contained Windows x64 single-file executable
        shell: pwsh
        run: |
          dotnet publish windows-wpf/DnsPulse.App/DnsPulse.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o artifacts/win-x64

      - name: Copy assets & license into portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/win-x64/assets | Out-Null
          if (Test-Path assets/dns_catalog_1000.tsv) { Copy-Item assets/dns_catalog_1000.tsv artifacts/win-x64/assets/dns_catalog_1000.tsv -Force }
          if (Test-Path LICENSE) { Copy-Item LICENSE artifacts/win-x64/LICENSE.txt -Force }
          if (Test-Path README.md) { Copy-Item README.md artifacts/win-x64/README.md -Force }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/DNS-Pulse-win-x64-portable.zip -Force

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $innoPath = $cmd.Source
            } else {
              choco install innosetup -y --no-progress
            }
          }
          if (Test-Path $innoPath) {
            & $innoPath "windows-wpf\installer\DnsPulse.iss"
          } else {
            iscc.exe "windows-wpf\installer\DnsPulse.iss"
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "artifacts/win-x64/DnsPulse.exe",
            "artifacts/DNS-Pulse-win-x64-portable.zip",
            "artifacts/DNS-Pulse-win-x64-setup.exe"
          ) | Where-Object { Test-Path $_ }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $f
            "$hash  $name"
          }
          $lines | Out-File -FilePath artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Pulse-win-x64
          path: |
            artifacts/win-x64/DnsPulse.exe
            artifacts/DNS-Pulse-win-x64-portable.zip
            artifacts/DNS-Pulse-win-x64-setup.exe
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win-x64/DnsPulse.exe
            artifacts/DNS-Pulse-win-x64-portable.zip
            artifacts/DNS-Pulse-win-x64-setup.exe
            artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: true
